[project]
name = "easy-tell-finance"
version = "0.1.0"
description = "쉬운말 서비스 데모 — 금융 약관 쉬운말 치환 CLI (Colab 실행용)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kiwipiepy>=0.18",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingTypeStubs = "warning"
reportUnknownParameterType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownMemberType = "warning"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
